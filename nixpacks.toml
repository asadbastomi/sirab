[phases.postbuild]
cmds = [
    "php /app/artisan optimize:clear",
    "php /app/artisan storage:link",
]
dependsOn = ["build"]

[staticAssets]
"nginx.template.conf" = '''
worker_processes 5;
daemon off;
worker_rlimit_nofile 8192;
events {
  worker_connections  4096;  # Default: 1024
}
http {
    include       $!{nginx}/conf/mime.types;
    default_type  application/octet-stream;
    index         index.html index.htm index.php;

     # ✅ Rate limit: max 30 req per menit, burst 10
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/m;
    limit_req_status 429;

    log_format main '$remote_addr - $remote_user [$time_local] $status '
                    '"$request" $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log  /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name .banjarmasinkota.go.id localhost;

        if ($http_user_agent ~* (bingbot|ahrefsbot|mj12bot|semrushbot|mozlila|moblie|anon|nikto|nmap|masscan|sqlmap|python-requests|curl|wget|scan|privacy|perplexitybot|nexus\s5x|android\s6\.0\.1|android\s16)) {
            return 444;
        }

        if ($request_uri ~* (xmlrpc\.php|wp-login\.php|wp-json|wp-admin|wp-content|wp-includes|sftp-config\.json|filemanager|/rest_route=|/alfacgiapi/|/\.well-known/traffic-advice|slot|tesla|casino|jackpot|winplay|bonanza|pgsoft|getPasswordPolicy|dialog\.php|radio\.php)) {
            return 444;
        }

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app/public;
        )

        index index.php;
        charset utf-8;
        client_max_body_size 6M;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        # ✅ Skip rate limiting for static assets (fonts, css, js, images, icons)
        location ~* \.(?:css|js|woff2?|ttf|eot|svg|jpg|jpeg|png|gif|ico)$ {
            access_log off;
            expires 30d;
        }

        # ✅ Laravel main route with rate limit
        $if(IS_LARAVEL) (
            location / {
                limit_req zone=global_limit burst=10 nodelay;
                try_files $uri $uri/ /index.php?$query_string;
            }
        ) else ()

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        $if(IS_LARAVEL) (
            error_page 404 /index.php;
        ) else ()

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PHP_VALUE "upload_max_filesize=6M \n post_max_size=6M";
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}'''
"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = nobody
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no
catch_workers_output = yes
'''
